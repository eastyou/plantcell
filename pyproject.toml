[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plantcell"
version = "0.1.0"
description = "细胞结构：标注挂图、结构查询与练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "biology", "cell", "organelle", "poster", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
plantcell = "plantcell.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/plantcell"
Source = "https://github.com/eastyou/plantcell"

[tool.setuptools]
packages = ["plantcell"]
